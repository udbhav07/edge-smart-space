# Broker configuration for a single-node deployment.
#
# Persistence is on because retained topics are how a late-joining subscriber
# learns the current mode, the active faults and the last applied goal
# (FR-61). Losing them on a broker restart would leave every component
# correct and the system as a whole amnesiac.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# The blackboard is a local bus on a device in one room (section 2.2 puts
# authentication out of scope). If that ever stops being true, this is the
# file that changes -- and nothing else, because no component holds a
# credential.
