# Drop-in for the system broker: /etc/mosquitto/conf.d/edge-smart-space.conf
# (deploy/provision.sh installs it).
#
# Ubuntu's own /etc/mosquitto/mosquitto.conf already turns persistence on,
# which is what keeps retained topics -- the current mode, the active faults,
# the last applied goal (FR-61) -- across a broker restart. This file adds only
# what the ESP32 nodes need: a listener on the network rather than loopback.
#
# The blackboard is a local bus on a device in one room (section 2.2 puts
# authentication out of scope). If that ever stops being true, this is the
# file that changes -- and nothing else, because no component holds a
# credential.
listener 1883
allow_anonymous true
