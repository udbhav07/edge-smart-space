# ESP32 node: indoor temperature, humidity, occupancy, and the IR blaster.
#
# UNVERIFIED. No node has been flashed with this yet, and it is written to be
# obviously unfinished rather than plausibly complete (R-03). Three things are
# guesses until a board exists, and each one is a line in config/default.yaml
# rather than a line in code, so settling them is an edit:
#
#   * the pins below,
#   * the topic each entity publishes on, which follows from `name` and
#     `topic_prefix` and is mirrored in `io.devices`,
#   * whether the air conditioner responds to the IR codes at all, which is
#     what D5 exists to find out.
#
# The `state_topic` on every sensor is set explicitly rather than left to
# ESPHome's default, because the default derives from the entity name and a
# rename would silently move the topic out from under the bridge.

substitutions:
  node_name: room
  topic_prefix: esphome/room

esphome:
  name: ${node_name}

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # A node that drops off WiFi must look absent rather than stale. The bridge
  # ages a held value out after io.stale_after_s for the same reason.
  reboot_timeout: 5min

logger:
api:
ota:

mqtt:
  broker: !secret mqtt_broker
  topic_prefix: ${topic_prefix}
  # Readings are transient: the next sample supersedes a lost one, and a
  # retained reading would hand a restarting bridge a stale temperature as
  # though it had just been measured.
  discovery: false

sensor:
  - platform: dht
    pin: GPIO4
    model: DHT22
    temperature:
      name: indoor temperature
      state_topic: ${topic_prefix}/sensor/indoor_temperature/state
      # A-02 says 5 s. Jitter is expected and handled above; what must not
      # happen is a node quietly reporting at a different rate.
      filters:
        - throttle: 5s
    humidity:
      name: indoor humidity
      state_topic: ${topic_prefix}/sensor/indoor_humidity/state
      filters:
        - throttle: 5s
    update_interval: 5s

  - platform: dallas
    address: 0x0000000000000000   # PLACEHOLDER: read from the bus at bring-up
    name: outdoor temperature
    state_topic: ${topic_prefix}/sensor/outdoor_temperature/state
    # FR-03: 60 s or faster. Slower than indoor on purpose -- ambient moves
    # slowly, and D1's timeout for this sensor is derived from this cadence.
    update_interval: 60s

binary_sensor:
  - platform: gpio
    pin: GPIO15
    name: occupancy
    state_topic: ${topic_prefix}/binary_sensor/occupancy/state
    device_class: motion
    # Raw motion only. The vacancy hold-off that turns motion into presence
    # lives in src/common/occupancy.py so that the simulator and this node
    # derive occupancy identically (FR-02).

remote_transmitter:
  pin: GPIO14
  carrier_duty_percent: 50%

climate:
  - platform: coolix          # PLACEHOLDER: the protocol depends on the unit
    name: air conditioner
    # R-02: an IR blaster is open loop. Nothing here reports back, which is
    # why the driver publishes AckStatus.UNKNOWN and D5 decides whether a
    # command landed by watching the room respond.
