[project]
name = "edge-smart-space"
version = "0.1.0"
description = "Self-calibrating, fault-tolerant autonomous personal smart space"

# numpy 2.3 dropped Python 3.10. JetPack 6 ships 3.10 by default, so the
# Jetson needs a 3.11+ environment at acquisition (DESIGN.md A-05, 9.2).
requires-python = ">=3.11"

# Pinned exactly to the verified working set: no open ranges
# (docs/coding-guidelines.md, Dependencies & Security).
dependencies = [
    "pydantic==2.12.5",
    "paho-mqtt==2.1.0",
    "numpy==2.3.3",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src", "sim"]

[tool.coverage.report]
# T1: >=85% line, >=80% branch.
fail_under = 85
show_missing = true
