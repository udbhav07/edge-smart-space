[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-smart-space"
version = "0.1.0"
description = "Self-calibrating, fault-tolerant autonomous personal smart space"

# numpy 2.3 dropped Python 3.10. JetPack 6 ships 3.10 by default, so the
# Jetson needs a 3.11+ environment at acquisition.
requires-python = ">=3.11"

# Pinned exactly: no open ranges. This file is the only dependency manifest;
# anything added here must be verified to install, not assumed.
dependencies = [
    "pydantic==2.12.5",
    "paho-mqtt==2.1.0",
    "numpy==2.3.3",
    "PyYAML==6.0.3",
    # The reasoning layer is mandatory (FR-40) and talks to a local
    # OpenAI-compatible server -- llama.cpp or Ollama, never a hosted API
    # (NFR-06). Pure Python, so it belongs in the core, not with torch.
    "openai==1.68.2",
    # The occupant console (FR-56), started by start.py with everything else.
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    # Google Calendar and Gmail (FR-84 to FR-86): the console signs in, the
    # assistance service syncs. Nothing reaches Google until the occupant
    # connects an account, but both services are core, so their client
    # libraries are too.
    "google-auth==2.57.1",
    "google-auth-oauthlib==1.5.0",
    "google-api-python-client==2.201.0",
    # The music player device (FR-87): decodes mp3, flac, wav and ogg and
    # plays them, with wheels for Windows, Linux and the Jetson's aarch64.
    "miniaudio==1.71",
    # The MCP bridge (FR-90): mounts any MCP server as a device on the board.
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # fastapi.testclient runs on it; the console's tests need nothing else.
    "httpx==0.28.1",
]

# Voice pipeline. Kept optional because torch and friends are large, and
# because torch 2.5.1 has no wheel for Python 3.14: a developer on 3.14
# installs the core only and the speech tests skip themselves. CI runs 3.11,
# where the whole set installs and every test executes.
speech = [
    "openwakeword==0.6.0",
    "faster-whisper==1.1.1",
    "PyAudio==0.2.14",
    "silero-vad==5.1.2",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    # Speaking replies (FR-79), in the same service that listens. Piper is a
    # neural voice run on this node, its model fetched once by
    # setup_models.py; pyttsx3 is the system's own voices, used when the
    # model file is missing.
    "piper-tts==1.8.0",
    "pyttsx3==2.99",
]

[tool.setuptools]
# Declared explicitly: flat layout with several top-level directories is
# ambiguous to auto-discovery.
packages = ["src", "sim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src", "sim"]

[tool.coverage.report]
# T1: >=85% line, >=80% branch.
fail_under = 85
show_missing = true
