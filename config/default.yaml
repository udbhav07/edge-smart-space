# Default configuration.
#
# Every value here is policy, not code. Detector thresholds are placeholders
# until Week 6 characterises the real room's disturbance magnitude and the
# CUSUM threshold is set from measured sigma rather than assumed (R-04).
#
# Sources: DESIGN.md sections 5.2.2, 5.3, 5.4, 5.5, 5.6, 7.2.

mqtt:
  host: localhost
  port: 1883
  keepalive_s: 60.0
  reconnect_min_s: 1.0
  reconnect_max_s: 30.0

loop:
  regulatory_period_s: 5.0      # NFR-01
  sensor_period_s: 5.0          # FR-01, A-02
  outdoor_period_s: 60.0        # FR-03, A-04

# Section 5.2.2. Effective memory is 1/(1-lambda) = 200 samples, about 17 min
# at a 5 s interval: tracks daily variation without chasing noise.
estimator:
  forgetting_factor: 0.995
  initial_covariance: 100.0
  initial_theta: [0.02, -0.05, 0.01]   # [a2, a3, a4]; a1 = 1 - a2 = 0.98
  max_covariance_trace: 1000.0
  min_excitation: 0.001
  # Divergence is a sustained rate, not a run. a2 and a4 both sit near a box
  # edge, so short runs of rejections are ordinary noise; half a window of
  # them for ten minutes is not (section 5.2.3).
  divergence_window_samples: 120
  divergence_rejection_fraction: 0.5
  # How far back the estimator keeps the inputs it was fitted on, so that a
  # fault detected late can be rolled forward from a state that predates it.
  # A stuck sensor is not detected until its variance has collapsed for a
  # whole window, by which time the newest readings are the fault itself:
  # seeding the free run from them makes the prediction follow the lie it was
  # meant to replace. Longer than the slowest sensor detector's window.
  fault_history_samples: 130
  indoor_sensor_id: temp_01
  outdoor_sensor_id: outdoor_01
  occupancy_sensor_id: pir_01
  excitation_window_samples: 20
  residual_sigma_window_samples: 60
  sample_interval_tolerance: 0.4   # +/-40% of the nominal period (A-02)
  # Plausibility box, section 5.2.1. a3 stays negative: an estimate crossing
  # zero claims the air conditioner heats the room.
  bounds_a1: {low: 0.0, high: 1.0}
  bounds_a2: {low: 0.0, high: 1.0}
  bounds_a3: {low: -2.0, high: 0.0}
  # a4 admits small negative excursions: occupancy gain is ~0.0008 for one
  # person, far below the noise floor, and rejecting every dip below zero
  # would raise MODEL_DIVERGENCE constantly (section 5.2.1).
  bounds_a4: {low: -0.05, high: 1.0}

# FR-07 and section 7.1: restore on restart, discard if older than a day.
persistence:
  path: state/coefficients.json
  interval_s: 300.0
  max_age_s: 86400.0

controller:
  # R-02: the IR path is open-loop and commands are lost. A controller that
  # sends its intent once and then says "no change" forever has no way back
  # from a lost command -- measured, a dropped OFF left the compressor running
  # and the room reached 18 C while the controller believed it had stopped and
  # sat emitting MAINTAIN. Re-asserting the intended state is what a real IR
  # integration does. Longer than the validator's 30 s command rate so a
  # refresh is never throttled into a no-op.
  reassert_interval_s: 60.0
  # R-01, weak excitation, and the measurement that made it urgent. Under
  # plain deadband control the compressor runs precisely when the room is
  # warm, so u and (T_out - T) are collinear and the fit inflates a2 and a3
  # about threefold. That model over-predicts cooling, so control on
  # prediction shuts the compressor off too early: measured, FR-27 left the
  # room at 29.3 C during a sensor dropout, worse than a plain thermostat --
  # while the same run given the true coefficients held the comfort band
  # exactly. Identification is the whole difference.
  #
  # The fix is the one R-01 names: drive the compressor on a schedule that
  # does not depend on the temperature, so the two stop being collinear. It
  # costs comfort while it runs, which is why it is bounded in time and
  # abandoned the moment the room leaves the envelope below.
  excitation_duration_s: 5400.0   # Identification phase after startup
  excitation_period_s: 900.0      # Full cycle; half on, half off
  excitation_envelope_c: 2.0      # Never excite the room past this from setpoint
  # How far one spoken request moves the setpoint when somebody asks for
  # "cooler" rather than naming a temperature. A degree is noticeable without
  # being startling, and asking twice moves it twice because the step is
  # applied to what is in force rather than to a constant.
  comfort_step_c: 1.0
  deadband_c: 0.5
  min_off_s: 180.0
  default_setpoint_c: 24.0

# Rules V-1 to V-6, section 5.4.
validator:
  setpoint_bounds_c: {low: 18.0, high: 30.0}
  max_step_c: 2.0
  min_off_s: 180.0
  min_command_interval_s: 30.0
  goal_max_age_s: 600.0

# Local time is epoch plus this fixed offset, never the machine's zone, so a
# simulated day replays from its seed and "Thursday at three" means the same
# thing to the tariff, to the model and to the calendar however the Orin was
# provisioned.
site:
  utc_offset_h: 5.5             # Hyderabad; the room does not move

# FR-16. The pricing schedule the supervisor reasons about. While peak, it
# may propose the comfort band shifted up by peak_offset_c, and that proposal
# is gated by the validator like any other.
tariff:
  peak_offset_c: 1.0
  peak_windows:
    - {start_h: 18.0, end_h: 22.0}

# Section 8.3. Evaluation policy, used by the experiments and by nothing that
# runs in production. The comfort band is what success criterion 4 is measured
# against: the room is comfortable while it is within this of the setpoint.
# Wider than the controller's 0.5 C deadband on purpose, so ordinary deadband
# cycling is not counted as discomfort.
evaluation:
  comfort_band_c: 1.0

# Section 5.5. Latency targets: D1 under 20 s, D2 under 60 s, D3 under 10 s.
detectors:
  dropout:
    timeout_periods: 3.0
  stuck_at:
    window_samples: 60
    variance_epsilon: 0.001
    consecutive_windows: 2
  out_of_range:
    temperature_c: {low: -10.0, high: 60.0}
    humidity_pct: {low: 0.0, high: 100.0}
    # An air conditioner cannot generate power, and a 4000 W cooling unit on a
    # domestic circuit does not draw 5 kW. Anything outside is a meter wired
    # backwards or broken. Re-derived from the real unit's nameplate at
    # bring-up.
    power_w: {low: 0.0, high: 5000.0}
    debounce_samples: 2
  # D4, section 5.5. A two-sided CUSUM on the residual divided by its own
  # standard deviation, so the thresholds are in sigma and survive a change of
  # sensor. R-04 re-derives both from measured sigma during bring-up; these are
  # the textbook starting pair.
  drift:
    # k: drift smaller than this is absorbed rather than accumulated. Section
    # 5.5 specifies 0.5, which is the textbook half-of-the-shift-you-want. It
    # does not survive contact with this plant: the estimator has no regressor
    # for the solar term (R-04), so the residual carries a modelling error the
    # sensor is not responsible for. Measured over a healthy 24 h run, the
    # cumulative sum peaks at 12.5 with k=0.5 against a threshold of 5 -- a
    # false drift fault every day -- and at 3.0 with k=1.0. This is exactly the
    # re-derivation R-04 calls for, done here in simulation and due again on
    # hardware, where the real room's unmodelled disturbances set it.
    slack_sigma: 1.0
    threshold_sigma: 5.0          # h: cumulative sum at which drift is called
    min_residual_sigma_c: 0.02    # Below this the noise floor is not characterised yet
    # No single sample may carry the test on its own. A cumulative test is
    # meant to be driven by persistence, not by magnitude; without a cap one
    # outlier clears h and D4 becomes the threshold alarm it exists to replace.
    max_sample_sigma: 4.0
    # Samples ignored before the test starts. A residual is the joint error of
    # the sensor and the model, so blaming the sensor means nothing until the
    # model has converged -- and during the first cooling ramp the model lags
    # badly enough to look exactly like a drifting sensor. Measured, not
    # chosen: over a healthy 100-minute run the cumulative sum peaks at 10.3
    # from the first sample, 7.3 after 60, and 3.05 after 120, where it stops
    # improving. 120 is where the identification transient ends, and it leaves
    # a margin of nearly 2 sigma below the threshold. R-04 re-derives it on
    # hardware, where the room's real time constant decides it.
    warmup_samples: 120
  # D5, section 5.5. The room's thermal time constant is long, so an actuator
  # fault is found in about ten minutes rather than seconds. NFR-02 does not
  # promise otherwise.
  actuator:
    evaluation_window_s: 600.0    # Sustained cooling before the test is applied
    # The test is against the model's expectation, not a fixed number of
    # degrees. A room near its equilibrium cannot cool much however well the
    # air conditioner works, and a fixed threshold blames the actuator for
    # physics -- measured, it fired within an hour of every healthy run.
    # Below this much expected cooling there is no test worth running.
    # Estimates ignored before the test starts, for the same reason D4 has a
    # warm-up: the expectation comes from the model, and until the model has
    # converged the expectation is the prior. Measured, the prior over-predicts
    # cooling by about three times, so an honest plant misses the bar and D5
    # blames a working air conditioner for the estimator still learning.
    warmup_samples: 120
    min_expected_cooling_c: 0.2
    # Share of the expected cooling the room must actually deliver. Far below
    # one, and the reason is measured rather than cautious. Under closed-loop
    # deadband control the model is poorly identified: cooling runs precisely
    # when the room is warm, so u and (T_out - T) are collinear and the fit
    # inflates both a2 and a3 by about three times (R-01's weak excitation,
    # exactly as the risk register predicts). The two errors partly cancel, so
    # the net prediction over-states cooling by roughly 2.3x. Measured over
    # healthy windows the room delivers between 0.034 and 7.9 of what the model
    # expects, while a dead unit delivers between -0.139 and -0.019 -- negative,
    # because a room with no cooling warms. The two do not overlap, so any bar
    # between them separates them; 0.015 sits below the healthy minimum with
    # margin and well above the dead maximum. This is calibration against the
    # model that exists rather than the model the design assumed, and R-04
    # redoes it on hardware.
    response_fraction: 0.015

mode:
  degraded_sensor_budget_s: 1800.0   # Section 7.2; E4 tests whether this is right
  fault_clear_confirm_s: 120.0
  transition_deadline_s: 2.0         # FR-26

# Section 9.1, the phase transition. Which Layer 1 runs is a configuration
# choice, not a code change: 'simulated' starts the room simulator, 'esphome'
# starts the hardware bridge. Everything above Layer 1 subscribes to the same
# topics either way, so the whole test suite runs unchanged against both.
#
# The device topics below are placeholders and are marked as such. An ESPHome
# node's topic depends on how it is named at flash time, so the real values are
# a bring-up decision; putting them here rather than in code is what keeps that
# decision a config edit.
io:
  source: simulated
  # A device value older than this counts as silence rather than being
  # repeated. Repeating it would turn a dropped node into a stuck sensor and
  # send D1 looking for a fault that D2 would then find in the wrong place.
  stale_after_s: 30.0
  devices:
    - sensor_id: temp_01
      topic: esphome/room/sensor/indoor_temperature/state
    - sensor_id: hum_01
      topic: esphome/room/sensor/indoor_humidity/state
    - sensor_id: outdoor_01
      topic: esphome/room/sensor/outdoor_temperature/state
    - sensor_id: pir_01
      topic: esphome/room/binary_sensor/occupancy/state
    - sensor_id: pwr_01
      topic: esphome/room/sensor/ac_power/state
  actuator:
    # What the IR bridge listens on. R-02: nothing comes back, so the driver
    # reports UNKNOWN and D5 decides whether it worked by watching the room.
    command_topic: esphome/room/climate/air_conditioner/command
    acknowledges: false

# Section 5.1. Limits are what the instrument can physically report; the
# adapter flags a reading outside them as suspect but never suppresses it,
# because D3 exists to detect exactly that (FR-22).
sensors:
  # FR-02. A PIR reports motion, not presence: somebody reading quietly sets
  # off nothing, so the room stays occupied until nothing has been seen for
  # this long. Ten minutes is the documented default.
  vacancy_hold_off_s: 600.0
  adapters:
    - sensor_id: temp_01
      unit: C
      limits: {low: -10.0, high: 60.0}
      description: Indoor temperature
    - sensor_id: hum_01
      unit: "%RH"
      limits: {low: 0.0, high: 100.0}
      description: Indoor relative humidity
    - sensor_id: outdoor_01
      unit: C
      limits: {low: -20.0, high: 60.0}
      description: Ambient temperature
    - sensor_id: pir_01
      unit: bool
      limits: {low: 0.0, high: 1.0}
      description: Occupancy from PIR and door reed switch
    # Week 5. Nothing controls on it. It is measured because an IR path cannot
    # acknowledge a command (R-02), and the air conditioner's own draw is the
    # one reading that says whether the compressor is running at all. D1 and
    # D3 watch it; D2 does not, because an idle meter is constant by design.
    - sensor_id: pwr_01
      unit: W
      limits: {low: 0.0, high: 5000.0}
      description: Air conditioner electrical power

# Section 5.8. Capture opens only after the wake word and closes at end of
# utterance or the hard timeout (FR-50).
speech:
  sample_rate_hz: 16000
  channels: 1
  chunk_samples: 512            # Required size for Silero VAD
  device_index: null            # null selects the system default
  queue_seconds: 5.0
  wake_word: hey_jarvis
  # Measured, not chosen. The openWakeWord hey_jarvis model is trained on
  # American-accented speech and does not fire reliably for this team at 0.5;
  # 0.1 detects consistently. That is a finding about the model, not a tuning
  # knob, and it has a cost: the capture window opens more readily on
  # background noise. FR-50 still holds structurally, since capture only ever
  # follows a detection, but the false-wake rate is higher than the section
  # 5.8 privacy claim implies. Retrain or swap the model to raise this.
  wake_word_threshold: 0.1
  vad_silence_ms: 1000
  no_speech_timeout_s: 3.0
  command_timeout_s: 15.0
  asr_model: base.en
  # GPU first. 'auto' prefers CUDA and falls back to CPU so a laptop still
  # runs (NFR-09); 'cuda' demands it and fails loudly if absent, which is what
  # you want on the Jetson where a silent CPU fallback looks like slow code
  # rather than a broken build (section 9.2).
  asr_device: auto
  asr_compute_type: auto

# Section 5.7.5. One server serves every call site.
reasoning:
  base_url: http://localhost:11434/v1
  model: qwen2.5:7b
  timeout_s: 30.0
  max_history_turns: 20
  temperature: 0.0              # E6 measures the model, not the dice
  max_audit_chars: 4000         # Per text field of a ReasoningRecord
  # FR-41. The Environmental Supervisor runs on this cadence and on events:
  # an occupancy transition, a tariff transition, a newly confirmed fault.
  supervisor_period_s: 300.0
  supervisor_min_interval_s: 30.0   # A flapping PIR is not a queue of calls
  supervisor_max_rounds: 6          # Model turns before a run is abandoned
  supervisor_goal_lifetime_s: 600.0 # Two cadences: one miss is no gap
  vacancy_relax_c: 2.0              # How much warmer an empty room may run
  # FR-44's post-decode check on propose_setpoint. Wider than the validator on
  # purpose: 5 C is a request the gate must be seen refusing; 500 C is not a
  # room temperature and never reaches it.
  plausible_setpoint_c: {low: 0.0, high: 50.0}
  verdict_timeout_s: 2.0            # Wait for the gate's answer, then move on

# Section 5.7.6. The tool surface itself is a declaration in code; the only
# policy number in it is how long an occupant has to answer.
assistance:
  # The calendar this system writes to (FR-58). A file on this machine rather
  # than a hosted account: NFR-06 keeps the node self-contained, and a hosted
  # calendar would put an OAuth credential on a device sitting in a room.
  calendar_path: state/calendar.json
  # Seconds a proposed invocation stays confirmable. A confirmation arriving
  # after this is refused rather than run late: agreeing to a booking is
  # agreeing to the one that was described, not to whatever is still pending.
  confirmation_window_s: 300.0
  # Rounds of tool calls one reasoning call may make before it must answer.
  # One is enough to look something up and reply about it, and it is what
  # keeps Personal Context a bounded call rather than an open-ended agent.
  max_tool_rounds: 1
  # Seconds to wait for a result on space/assist/result before giving up and
  # answering without it. A calendar that has stopped responding must not hold
  # a reply to the occupant open indefinitely.
  result_timeout_s: 5.0

# Adversarial by default. Every value here is switched on, not off: a kind
# simulator makes simulated success predict nothing about hardware.
sim:
  room:
    thermal_capacitance_j_per_k: 600000.0   # ~35 m3 room plus furnishings
    thermal_resistance_k_per_w: 0.0035
    # Sized so the setpoint is reachable across the whole daily cycle. At the
    # 35 C peak, holding 24 C needs (35-24)/R plus the occupant and solar
    # gains, which is 3543 W; 2500 W left the plant 1043 W short and the room
    # climbed back to 27 C every afternoon with the compressor at full power.
    # A controller evaluated on a problem it cannot solve tells you nothing
    # about the controller, and D5 rightly called the saturated plant faulty.
    # 4000 W is a standard unit for a room this size and leaves 1.6 C of
    # margin at the peak. Deliberately *not* generous beyond that: the plant
    # should still have to work.
    cooling_power_w: 4000.0
    occupant_gain_w: 100.0
    initial_temperature_c: 29.0
    solar_gain_amplitude_w: 300.0           # Estimator has no regressor for this
    solar_gain_period_s: 14400.0
    # Relative humidity at the reference temperature with a dry coil. Hyderabad
    # indoors, roughly. Nothing above Layer 1 controls on humidity; FR-01
    # requires it measured and published and D1/D3 watch it.
    baseline_humidity_pct: 55.0
  sensor_noise:
    sigma_c: 0.15
    quantisation_c: 0.1
    jitter_s: 0.5                           # A-02's stated jitter, always on
    dropout_probability: 0.01
    bias_c: 0.0
  actuator:
    dead_time_s: 30.0
    command_loss_probability: 0.02
    acknowledges: false                     # R-02: open-loop IR cannot confirm
  # The air conditioner's supply, metered. The draw follows the drive the room
  # actually receives, so a unit broken STUCK_OFF reads standby power while
  # still being commanded to cool.
  power_meter:
    rated_power_w: 1300.0       # 4000 W of cooling at a COP near three
    standby_power_w: 4.0
    sigma_w: 8.0                # Typical of a PZEM-004T at this load
    resolution_w: 1.0
    dropout_probability: 0.01
    seed_offset: 1              # Its own random stream; see sim/run_sim.py
  # A room that is occupied forever is not a room, and it breaks
  # identification outright. Occupancy enters the model as a regressor, so a
  # constant one is a free intercept: the fit parks an offset in a4 and
  # inflates everything else to compensate. Measured over six hours, with
  # occupancy pinned on, a2 came out 4.3x its true value and a3 3.6x; letting
  # occupancy vary brought a3 to 0.98x. This is the single biggest influence
  # on whether the model is worth controlling on (R-01).
  occupancy:
    period_s: 7200.0          # One cycle of coming and going
    occupied_fraction: 0.6    # Share of the cycle somebody is present
  outdoor_mean_c: 31.0
  outdoor_amplitude_c: 4.0
  outdoor_period_s: 86400.0
  random_seed: 20260825
