# Default configuration.
#
# Every value here is policy, not code. Detector thresholds are placeholders
# until Week 6 characterises the real room's disturbance magnitude and the
# CUSUM threshold is set from measured sigma rather than assumed (R-04).
#
# Sources: DESIGN.md sections 5.2.2, 5.3, 5.4, 5.5, 5.6, 7.2.

mqtt:
  host: localhost
  port: 1883
  keepalive_s: 60.0
  reconnect_min_s: 1.0
  reconnect_max_s: 30.0

loop:
  regulatory_period_s: 5.0      # NFR-01
  sensor_period_s: 5.0          # FR-01, A-02
  outdoor_period_s: 60.0        # FR-03, A-04

# Section 5.2.2. Effective memory is 1/(1-lambda) = 200 samples, about 17 min
# at a 5 s interval: tracks daily variation without chasing noise.
estimator:
  forgetting_factor: 0.995
  # P0. The coefficients are around 0.002 to 0.02, so 0.01 is a prior spread
  # of about 0.1 -- loose against the values, tight against nonsense. At
  # startup the three regressors are nearly collinear (gap, u and o all near
  # constant), and at 100.0 the first few samples could throw the estimate
  # anywhere in the plausibility box: live, a2 = 0.997 and a3 = -1.91 within
  # 35 s. Over 8 seeds, a 20-minute dropout ridden 10 min after startup
  # erred by up to 2.65 C at 0.01 against 10.96 C at 100; E1's 24 h errors
  # are unchanged.
  initial_covariance: 0.01
  initial_theta: [0.02, -0.05, 0.01]   # [a2, a3, a4]; a1 = 1 - a2 = 0.98
  max_covariance_trace: 1000.0
  min_excitation: 0.001
  # Divergence is a sustained rate, not a run. a2 and a4 both sit near a box
  # edge, so short runs of rejections are ordinary noise; half a window of
  # them for ten minutes is not (section 5.2.3).
  divergence_window_samples: 120
  divergence_rejection_fraction: 0.5
  indoor_sensor_id: temp_01
  outdoor_sensor_id: outdoor_01
  occupancy_sensor_id: pir_01
  excitation_window_samples: 20
  residual_sigma_window_samples: 60
  # FR-23. A one-step residual sees a drifting sensor only by its increment
  # per sample -- 0.05 C at 0.01 C/s, a quarter of the noise -- so D4 never
  # accumulated anything. Predicting each reading from the one this many
  # samples earlier shows the same drift as the whole offset built up over
  # the horizon (0.6 C over 60 s), while a healthy model's one-minute error
  # stays small.
  drift_horizon_samples: 12
  # FR-27. Trusted steps kept so that, when the indoor sensor is confirmed
  # faulted, the model restarts from the last reading before the onset the
  # detector reported -- D2's frozen window, D4's change point -- instead of
  # from the fault itself. 15 min; must exceed D2's window.
  reanchor_history_samples: 180
  # a2 sits on its lower bound and noise crosses it. A crossing is weighed by
  # the gap, as the heat flow against the gradient it claims: healthy runs
  # never claimed more than 0.083 C per step, a room warming while cooled a
  # median 0.13. Below this the rejection is refused but not counted toward
  # divergence (section 5.2.3).
  edge_noise_c_per_step: 0.1
  horizon_sigma_window_samples: 240
  sample_interval_tolerance: 0.4   # +/-40% of the nominal period (A-02)
  # Plausibility box, section 5.2.1. a3 stays negative: an estimate crossing
  # zero claims the air conditioner heats the room.
  bounds_a1: {low: 0.0, high: 1.0}
  bounds_a2: {low: 0.0, high: 1.0}
  bounds_a3: {low: -2.0, high: 0.0}
  # a4 admits small negative excursions: occupancy gain is ~0.0008 for one
  # person, far below the noise floor, and rejecting every dip below zero
  # would raise MODEL_DIVERGENCE constantly (section 5.2.1).
  bounds_a4: {low: -0.05, high: 1.0}

# FR-07 and section 7.1: restore on restart, discard if older than a day.
persistence:
  path: state/coefficients.json
  interval_s: 300.0
  max_age_s: 86400.0

controller:
  deadband_c: 0.5
  min_off_s: 180.0
  default_setpoint_c: 24.0
  # R-02: the IR path is open-loop and commands are lost. Re-asserting the
  # intended state is what a real IR integration does; a dropped OFF otherwise
  # leaves the compressor running while the controller believes it stopped.
  # Longer than the validator's 30 s command rate so a refresh is never
  # throttled into a no-op.
  reassert_interval_s: 60.0
  # R-01: drive the compressor on a schedule independent of the temperature
  # after startup, so u and (T_out - T) stop being collinear and the model is
  # identifiable. OFF here: this branch addresses R-01 with a tighter startup
  # prior instead (FR-04), and its detector tuning was measured without
  # excitation. Set excitation_duration_s to 5400 to reproduce the E2/E5 runs
  # that were measured with it.
  excitation_duration_s: 0.0
  excitation_period_s: 900.0      # Full cycle; half on, half off
  excitation_envelope_c: 2.0      # Never excite the room past this from setpoint

# Rules V-1 to V-6, section 5.4.
validator:
  setpoint_bounds_c: {low: 18.0, high: 30.0}
  max_step_c: 2.0
  min_off_s: 180.0
  min_command_interval_s: 30.0
  goal_max_age_s: 600.0

# Section 5.5. Latency targets: D1 under 20 s, D2 under 310 s (a full window
# of 60 samples must first fill), D3 under 10 s. Re-derived from a recorded
# healthy run by tools/calibrate.py (R-04).
detectors:
  dropout:
    timeout_periods: 3.0
  stuck_at:
    window_samples: 60
    variance_epsilon: 0.001
    consecutive_windows: 2
  out_of_range:
    temperature_c: {low: -10.0, high: 60.0}
    humidity_pct: {low: 0.0, high: 100.0}
    # A unit cannot generate power, and a 1-ton split on a domestic circuit
    # does not draw 5 kW. Re-derived from the real unit's nameplate (R-04).
    power_w: {low: 0.0, high: 5000.0}
    debounce_samples: 2
  # D4, section 5.5. A two-sided CUSUM on the residual divided by its own
  # standard deviation, so the thresholds are in sigma and survive a change of
  # sensor. R-04 re-derives both from measured sigma during bring-up; these are
  # the textbook starting pair.
  drift:
    # Measured on the horizon residual, accumulated once per non-overlapping
    # horizon (FR-23). Six healthy four-hour runs peaked at 2.0 to 6.3; drift
    # was found in 2-3 min at 3 C/min, 8-16 min at 0.6 C/min, 25-28 min at
    # 0.18 C/min, and not within 30 min at 0.06 C/min -- the floor, set by how
    # far the identified model can predict unaided. R-04 re-derives these.
    slack_sigma: 1.0              # k: drift smaller than this is absorbed, not accumulated
    threshold_sigma: 8.0          # h: cumulative sum at which drift is called
    min_residual_sigma_c: 0.02    # Below this the noise floor is not characterised yet
    # No single sample may carry the test on its own. A cumulative test is
    # meant to be driven by persistence, not by magnitude; without a cap one
    # outlier clears h and D4 becomes the threshold alarm it exists to replace.
    max_sample_sigma: 4.0
    # Samples ignored before the test starts. A residual is the joint error of
    # the sensor and the model, so blaming the sensor means nothing until the
    # model has converged -- and during the first cooling ramp the model lags
    # badly enough to look exactly like a drifting sensor. Measured, not
    # chosen: over a healthy 100-minute run the cumulative sum peaks at 10.3
    # from the first sample, 7.3 after 60, and 3.05 after 120, where it stops
    # improving. 120 is where the identification transient ends, and it leaves
    # a margin of nearly 2 sigma below the threshold. R-04 re-derives it on
    # hardware, where the room's real time constant decides it.
    warmup_samples: 120
  # D5, section 5.5. The room's thermal time constant is long, so an actuator
  # fault is found in about ten minutes rather than seconds. NFR-02 does not
  # promise otherwise.
  actuator:
    evaluation_window_s: 600.0    # Sustained cooling before the test is applied
    min_cooling_c: 0.3            # Cooling the room must have achieved over that window
    # A working unit cooling toward its capacity slows asymptotically: with 31 C
    # outside, the shipped room crept 25.3 -> 25.2 C in ten minutes and every
    # healthy two-hour run ended in DEGRADED_ACTUATOR. Beyond this gap below
    # ambient, a dead unit would warm visibly (about 2 C per window at 6 C), so
    # holding level is evidence the unit works and only warming by
    # min_cooling_c is a fault. Within it the room must still cool. Derived
    # from the simulated plant's capacity; R-04 re-derives it on hardware.
    capacity_gap_c: 4.0
    # A dead unit lets the room warm passively toward ambient, at a rate set by
    # its time constant; a drifting sensor rises at any rate. A reading that
    # rose faster than this multiple of the passive bound, plus the slack, is
    # not the unit's doing, and D5 leaves it to D4 (FR-23, FR-24).
    passive_warming_factor: 1.5
    passive_warming_slack_c: 0.5
    # S-02. When the meter shows the unit running and the reading still rose,
    # humidity says whether the room really warmed: at constant vapour a room
    # warming 1 C loses about 3 %RH. Fell with it: the unit runs but does not
    # cool (lost refrigerant), D5's fault. Did not: the reading drifted, D4's.
    humidity_sensor_id: hum_01
    humidity_per_degree_pct: 3.0
    humidity_agreement: 0.5     # share of the expected fall that must be seen

mode:
  degraded_sensor_budget_s: 1800.0   # Section 7.2; E4 tests whether this is right
  fault_clear_confirm_s: 120.0
  transition_deadline_s: 2.0         # FR-26

# Section 5.1. Limits are what the instrument can physically report; the
# adapter flags a reading outside them as suspect but never suppresses it,
# because D3 exists to detect exactly that (FR-22).
sensors:
  # FR-02. A PIR reports motion, not presence: somebody reading quietly sets
  # off nothing, so the room stays occupied until nothing has been seen for
  # this long. Ten minutes is the documented default.
  vacancy_hold_off_s: 600.0
  adapters:
    - sensor_id: temp_01
      unit: C
      limits: {low: -10.0, high: 60.0}
      description: Indoor temperature
    - sensor_id: hum_01
      unit: "%RH"
      limits: {low: 0.0, high: 100.0}
      description: Indoor relative humidity
    - sensor_id: outdoor_01
      unit: C
      limits: {low: -20.0, high: 60.0}
      description: Ambient temperature
    - sensor_id: pir_01
      unit: bool
      limits: {low: 0.0, high: 1.0}
      description: Occupancy from PIR and door reed switch
    # Nothing controls on it. An IR path cannot acknowledge a command (R-02),
    # and the unit's own draw is the one reading that says whether the
    # compressor is running. D1 and D3 watch it; D2 does not, because an idle
    # meter is constant by design.
    - sensor_id: pwr_01
      unit: W
      limits: {low: 0.0, high: 5000.0}
      description: Air conditioner electrical power

# Section 5.8. Capture opens only after the wake word and closes at end of
# utterance or the hard timeout (FR-50).
speech:
  sample_rate_hz: 16000
  channels: 1
  chunk_samples: 512            # Required size for Silero VAD
  # The microphone, by part of its name (python -m tools.mics lists them).
  # Not by index: indices move whenever a headset connects, and the system
  # default vanished when one did, which stopped speech at start.
  device_name: C-Media
  device_index: null            # an index here wins over device_name
  queue_seconds: 5.0
  wake_word: hey_jarvis
  # Measured, not chosen. The openWakeWord hey_jarvis model is trained on
  # American-accented speech and does not fire reliably for this team at 0.5;
  # 0.1 detects consistently. That is a finding about the model, not a tuning
  # knob, and it has a cost: the capture window opens more readily on
  # background noise. FR-50 still holds structurally, since capture only ever
  # follows a detection, but the false-wake rate is higher than the section
  # 5.8 privacy claim implies. Retrain or swap the model to raise this.
  wake_word_threshold: 0.1
  vad_silence_ms: 1000
  no_speech_timeout_s: 3.0
  command_timeout_s: 15.0
  # FR-52. Who is speaking selects a personalisation profile and grants
  # nothing. Only the enrolled vectors are stored, never audio (FR-51).
  status_interval_s: 15.0        # heartbeat on space/speech/status
  # FR-76. Always listening: every utterance is transcribed, and one that is
  # not addressed with the wake word is ambient -- never answered, only mined
  # for a plan to pencil in (FR-77) or a fact to offer (FR-78). This revises
  # FR-50: the room's words are transcribed, though audio is still never kept
  # or published. wake_word restores capture-after-the-wake-word only.
  listen_mode: continuous
  ambient_min_words: 4           # fewer distinct words is dropped (noise reads as "No. No. No.")
  ambient_preroll_ms: 300        # keeps the first word of unaddressed speech
  # S-01. Live, room audio became nine junk calendar entries ("We are going home
  # We are going home ...", "Bye. Bye. Bye."). Overheard speech, and only
  # overheard speech, is held to Whisper's own hallucination thresholds.
  # FR-79. Replies are spoken. Piper is a neural voice run here; its model is
  # fetched once by setup_models.py. pyttsx3 (the system's voices) is the
  # fallback if Piper cannot load; none keeps the room silent.
  voice_engine: piper
  voice_model_path: models/piper/en_US-lessac-medium.onnx
  voice_length_scale: 1.0
  speaking_tail_ms: 400          # the microphone ignores the room's own voice
  ambient_max_no_speech_prob: 0.6
  ambient_min_avg_logprob: -1.0
  ambient_max_compression_ratio: 2.4
  ambient_min_distinct_ratio: 0.5    # distinct words / words, for 6 words or more
  voiceprints_path: state/voiceprints.json
  # Measured on synthetic voices: 88 % of household utterances recognised,
  # 5 % of strangers mistaken, nobody taken for the wrong member. Being a
  # guest is the safe error. Re-measure on real voices at enrolment.
  speaker_match_threshold: 0.15
  speaker_min_enrolment_utterances: 3
  speaker_min_audio_s: 1.0        # shorter utterances are judged as a guest
  speaker_min_speech_s: 1.5       # each enrolment take must hold this much speech
  asr_model: base.en
  # GPU first. 'auto' prefers CUDA and falls back to CPU so a laptop still
  # runs (NFR-09); 'cuda' demands it and fails loudly if absent, which is what
  # you want on the Jetson where a silent CPU fallback looks like slow code
  # rather than a broken build (section 9.2).
  asr_device: auto
  asr_compute_type: auto

# Section 5.7.5. One server serves every call site.
reasoning:
  base_url: http://localhost:11434/v1
  model: qwen2.5:7b
  timeout_s: 30.0
  max_history_turns: 20

# Section 5.7.6. The tool surface itself is a declaration in code; the only
# policy number in it is how long an occupant has to answer.
assistance:
  # Seconds a proposed invocation stays confirmable. A confirmation arriving
  # after this is refused rather than run late: agreeing to a booking is
  # agreeing to the one that was described, not to whatever is still pending.
  confirmation_window_s: 300.0
  # Rounds of tool calls one reasoning call may make before it must answer.
  # One is enough to look something up and reply about it, and it is what
  # keeps Personal Context a bounded call rather than an open-ended agent.
  max_tool_rounds: 1
  # Seconds to wait for a result on space/assist/result before giving up and
  # answering without it. A calendar that has stopped responding must not hold
  # a reply to the occupant open indefinitely.
  result_timeout_s: 5.0
  # FR-58. The occupant's own calendar, kept on the node: a hosted one needs
  # the outbound connection NFR-06 forbids. Bounded so a misheard request
  # repeated in a loop cannot fill the disk.
  calendar_path: state/calendar.json
  calendar_max_events: 500

# The goal path (FR-53). A spoken preference is proposed through the same
# validator as everything else; these only decide what is proposed and who
# outranks whom.
goals:
  comfort_step_c: 1.0       # "cooler" or "warmer" moves the setpoint this far
  preference_ttl_s: 600.0   # a spoken preference is a valid proposal this long
  # Without a hold, the next supervisory cycle would undo what the occupant
  # just asked for, and the system would appear to ignore them.
  preference_hold_s: 3600.0
  # V-2 grants at most max_step_c per proposal, so "make it 22" from 26 is
  # granted 24 and would stop there. A part-granted preference is proposed
  # again this often -- each time a fresh invocation the validator judges --
  # until it is reached, meets a bound, or lapses.
  pursue_interval_s: 60.0

# Week 5. Layer 1 is the simulator or the real nodes, and nothing above Layer 1
# can tell which (section 4.2). The topics are the nodes' ESPHome MQTT topics,
# placeholders until the nodes are flashed; ESPHome publishes plain values
# ("27.4", "ON") under <node>/<component>/<name>/state.
devices:
  source: simulated
  sensor_topics:
    temp_01: room-node/sensor/temperature/state
    hum_01: room-node/sensor/humidity/state
    outdoor_01: outdoor-node/sensor/temperature/state
    pir_01: room-node/binary_sensor/motion/state
    pwr_01: room-node/sensor/ac_power/state
  door_topic: room-node/binary_sensor/door/state
  stale_after_s: 20.0
  ac_mode_command_topic: ac-node/climate/air_conditioner/mode/command
  ac_target_command_topic: ac-node/climate/air_conditioner/target_temperature/command
  ac_mode_state_topic: ""   # IR has no readback (R-02); set it if the path has one
  # R-02's other answer: the meter on the unit's supply. A COOL that landed
  # draws running power within the grace period, an OFF that landed does not;
  # the bridge acknowledges on that, and reports FAILED when they disagree.
  ac_power_sensor_id: pwr_01
  ac_running_power_w: 200.0   # Compressor running; standby is a few watts
  ac_ack_grace_s: 60.0        # Past the unit's start-up delay

# Local time is epoch plus this fixed offset, never the machine's zone, so a
# simulated day replays the same from its seed on any laptop, and 18:00 means
# the same thing to the tariff, to the model and to the calendar however the
# Orin was provisioned.
site:
  utc_offset_h: 5.5             # Hyderabad; the room does not move

# FR-16. Peak pricing, as a local-time timetable. During peak the setpoint in
# force rises by the offset -- never past the validator's upper bound.
tariff:
  peak_start_hour: 18
  peak_end_hour: 22
  peak_offset_c: 1.0

# Section 8.3. Evaluation policy, used by the experiments and nothing that runs
# in production: the room is comfortable while within this of the setpoint.
evaluation:
  comfort_band_c: 1.0

# Week 5. What tools/bringup.py accepts as an instrument that is really there.
bringup:
  # Three outdoor periods. Measured on a live stack: 60 s saw the ambient
  # sensor once and the check failed every time by default.
  listen_s: 180.0
  max_interval_factor: 1.5      # Past this, D1 starts calling dropouts
  actuation_drop_c: 2.0         # Ask for this far below the room
  actuation_window_s: 300.0     # Longer than the 180 s dwell
  min_power_rise_w: 200.0       # Used only once a power meter is configured

# FR-52. What the room remembers about each person. Long-term memory is one
# Markdown file per person -- read it, edit it, delete it -- and short-term
# context is one JSON file per person that expires. Everything is bounded.
profiles:
  directory: state/profiles          # long-term, <profile_id>.md
  context_directory: state/context   # short-term, <profile_id>.json
  short_term_ttl_s: 1800.0           # a conversation is forgotten after 30 min
  guest_short_term_ttl_s: 300.0      # every unknown voice shares one; 5 min
  short_term_max_turns: 10
  max_facts: 50
  max_fact_chars: 200
  max_turn_chars: 500
  max_profiles: 8
  publish_interval_s: 30.0           # hand edits reach the blackboard this fast

# Week 7, R-04. How tools/calibrate.py re-derives detector thresholds from a
# recorded healthy run. Margins over what was measured, not thresholds.
calibration:
  timeout_margin: 1.5       # D1 timeout = longest healthy gap x this
  variance_fraction: 0.25   # D2 epsilon = quietest healthy window x this
  cusum_margin: 1.3         # D4 threshold = healthy CUSUM peak x this
  min_hours: 1.0            # Refuse a shorter recording
  cusum_min_samples: 2      # D4 never trips on fewer maximal samples
  dropout_latency_budget_s: 30.0   # NFR-02

# The Environmental Supervisor (sections 5.7.1, 5.7.2; FR-40, FR-41).
supervisor:
  period_s: 300.0           # FR-41's default cadence
  max_steps: 6              # four reads and a proposal, with one to spare
  goal_ttl_s: 900.0         # a proposal outlives three cycles, then lapses
  event_holdoff_s: 60.0     # a flapping sensor cannot trigger every tick
  # The policy the supervisor is asked to apply. Stated to the model as
  # numbers, and the occupancy tool reports whether the setback applies, so a
  # 7B model reads the decision rather than doing arithmetic.
  occupied_setpoint_c: 24.0
  vacant_setpoint_c: 27.0
  setback_after_s: 600.0

# Adversarial by default. Every value here is switched on, not off: a kind
# simulator makes simulated success predict nothing about hardware.
sim:
  room:
    thermal_capacitance_j_per_k: 600000.0   # ~35 m3 room plus furnishings
    thermal_resistance_k_per_w: 0.0035
    # A 1-ton split, the ordinary size for one room. Sized from measurement,
    # not taste: the room's UA is 1/R = 286 W/K, so a 35 C afternoon is a
    # 3.1 kW load before sun and occupant, and at 2500 W a perfectly healthy
    # system sat outside the comfort band every afternoon -- which made E5's
    # comparison meaningless, since nothing could hold the room. Fault-free
    # 24 h: 2500 W 20.0 % out of band, 3000 W 4.6 %, 3500 W 0.0 %.
    cooling_power_w: 3500.0
    occupant_gain_w: 100.0
    initial_temperature_c: 29.0
    solar_gain_amplitude_w: 300.0           # Estimator has no regressor for this
    solar_gain_period_s: 14400.0
    # Relative humidity at the reference temperature with a dry coil. Hyderabad
    # indoors, roughly. Nothing above Layer 1 controls on humidity; FR-01
    # requires it measured and published and D1/D3 watch it.
    baseline_humidity_pct: 55.0
  sensor_noise:
    sigma_c: 0.15
    quantisation_c: 0.1
    jitter_s: 0.5                           # A-02's stated jitter, always on
    dropout_probability: 0.01
    bias_c: 0.0
  actuator:
    dead_time_s: 30.0
    command_loss_probability: 0.02
    acknowledges: false                     # R-02: open-loop IR cannot confirm
  # The unit's supply, metered. 3500 W of cooling at a COP near three.
  power_meter:
    rated_power_w: 1200.0
    standby_power_w: 4.0
    sigma_w: 8.0                # Typical of a PZEM-004T at this load
    resolution_w: 1.0
    dropout_probability: 0.01
    seed_offset: 1
  outdoor_mean_c: 31.0
  outdoor_amplitude_c: 4.0
  outdoor_period_s: 86400.0
  outdoor_peak_hour: 15.0                   # Local; hottest mid-afternoon
  random_seed: 20260825

# FR-56 to FR-58: the occupant's console, served by `python -m src.console`.
# It has no authority: typed words go through the same extraction as speech,
# the comfort setting is a preference the validator gates, and stopping it
# changes nothing else. Local only: 127.0.0.1, or this node's LAN address.
console:
  host: 127.0.0.1
  port: 8077
  conversation_kept: 80
  activity_kept: 120
  calendar_days: 7
  history_kept: 360             # points per charted series: 30 min at 5 s
  operator_controls: true       # fault injection and reset, for demonstration
  inbox_path: state/console/inbox.json   # the inbox survives a restart (S-10)
  presets_c: {Cool: 22.0, Comfort: 24.0, Sleep: 25.0, Eco: 26.0}   # Home's one-tap targets
  cooling_off_c: 30.0           # 'cooling off' = the gate's upper bound, never beyond
  price_per_kwh: {normal: 8.0, peak: 12.0}
  currency: Rs

# FR-84 to FR-86. Google Calendar and Gmail, once the occupant connects an
# account in Settings. Until then nothing leaves this node (NFR-06).
google:
  client_secret_path: state/google/client_secret.json
  token_path: state/google/token.json
  outbox_path: state/google/outbox.json
  outbox_max: 500
  redirect_uri: http://127.0.0.1:8077/api/google/callback
  calendar_id: primary
  pull_interval_s: 300.0
  pull_days: 14
  retry_min_s: 10.0
  retry_max_s: 600.0

# FR-76 to FR-78. What the reasoning layer does with speech nobody addressed
# to it: one bounded model call per overheard line, looking for a plan to
# pencil into the calendar as tentative and a fact to offer for keeping.
ambient:
  context_s: 300.0              # earlier lines kept as context, so a plan split
                                # across sentences reads as one
  max_lines: 8                  # lines of context per voice
  max_calls_per_min: 6          # leaves the server to the assistant and supervisor
